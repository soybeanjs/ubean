name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          # dev-dx.test.ts 在真实浏览器里走查（语言切换 / matcher / Server Action / PPR / 服务端岛屿 /
          # 延迟数据）。runner 镜像里没有浏览器二进制，必须显式下载 —— 只装 chromium，那是这套用例
          # 唯一用到的浏览器。缓存键跟着 lockfile 走：playwright 版本由它钉住，升级会自动换键。
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Client JS budget
        run: |
          pnpm --filter ubean-test build
          pnpm --filter ubean-test analyze:check

      - name: Type check the example project
        # 示例的 `type-check` 脚本此前没人跑：根 `pnpm typecheck` 只覆盖 `packages/*`，而示例的
        # type-check 曾经整片失败却 CI 全绿（生成文件 `.ubean/components.d.ts` 里的语法错误 ——
        # `@ts-nocheck` 压不住语法错误，连带整个项目）。
        #
        # 它依赖 `.ubean/*` 生成物，其中 `openapi.d.ts` 也只能由构建产出（构建期用进程内请求取 spec；
        # 此前只有 `ubean dev` 会生成它）。这里显式构建一次，让这一步自成一体 —— 不依赖前面步骤的
        # 产物顺序，单独挪动/复跑都成立。
        run: |
          pnpm --filter ubean-test build
          pnpm --filter ubean-test type-check

      - name: Build the docs site
        # apps/docs 此前完全不在 CI 覆盖范围内：上次构建是手工跑的，之后源文件持续更新却无人察觉，
        # 直到整个站点的 markdown 内容静默不渲染。这里跑完整 SSG 构建，让预渲染失败（例如 SSR 期间
        # 取不到 ui 主题上下文 → 0 路由）在 CI 就暴露，而不是等部署后才发现。
        #
        # build:api 依赖 packages/*/dist/*.d.ts，由上一步的 `pnpm typecheck`(内含 pnpm build) 产出。
        run: pnpm --filter @ubean/docs build

      - name: Verify package tree & extension contract
        # OPT-09 + OPT-07：护栏脚本——AGENTS.md 包名/包数与 packages/*/package.json 一致，
        # engineering.md 契约表覆盖全部派生扩展包。详见 scripts/verify-packages.mjs。
        run: node scripts/verify-packages.mjs

      - name: Check docs i18n
        # 文档国际化的漂移门禁：缺译文 / en 正文变更后译文未同步 / 译文破坏 markdown
        # 结构（标题层级、代码块语言、链接条数）→ 退出 1。
        #
        # 加这一步是因为漂移此前是静默的：en 内容有 43 次提交、zh 只有 38 次，差额
        # 没人发现；站点还曾有过 17/29 篇是占位页却无人察觉的阶段。它不调用 DeepL
        # （只读文件比对），所以不需要密钥、不消耗配额，可以安全地阻断 merge。
        #
        # 判定「什么算漂移」用的是 zh frontmatter 里的 translatedFrom 源哈希 +
        # sections 分节指纹，两者由 `node scripts/i18n-stamp.mjs` 维护。
        run: node scripts/i18n-check.mjs
