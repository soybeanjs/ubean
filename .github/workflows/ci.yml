name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          # dev-dx.test.ts 在真实浏览器里走查（语言切换 / matcher / Server Action / PPR / 服务端岛屿 /
          # 延迟数据）。runner 镜像里没有浏览器二进制，必须显式下载 —— 只装 chromium，那是这套用例
          # 唯一用到的浏览器。缓存键跟着 lockfile 走：playwright 版本由它钉住，升级会自动换键。
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Client JS budget
        run: |
          pnpm --filter ubean-test build
          pnpm --filter ubean-test analyze:check

      - name: Verify package tree & extension contract
        # OPT-09 + OPT-07：护栏脚本——AGENTS.md 包名/包数与 packages/*/package.json 一致，
        # engineering.md 契约表覆盖全部派生扩展包。详见 scripts/verify-packages.mjs。
        run: node scripts/verify-packages.mjs
