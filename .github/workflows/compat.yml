name: Compat

# TS-18：依赖版本兼容矩阵 —— 周期性（nightly）或手动触发，**不进 PR 门禁**。
#
# 为什么不进门禁：装一遍 node_modules 很慢，而兼容矩阵的价值在**揭示**「升级会坏在哪」，
# 不在阻断 merge —— 真正阻断 merge 的是 `pnpm-workspace.yaml` 里钉住的精确版本（那是显式提交，
# 由 `packages/builder/test/vite-plus-contract.test.ts` 的精确比对守着）。
#
# 机制照 Waku 的 `react_version` override 先例：改 `pnpm-workspace.yaml` 的 `overrides`
# → 重新 install → 跑同一套 L2 → 逐字节还原两份入库文件（`scripts/dep-matrix.mjs`）。

on:
  schedule:
    # 每天 18:30 UTC（= 北京时间 02:30），错开 CI 高峰
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      dep:
        description: '要覆盖的依赖轴'
        required: false
        default: 'vue'
      version:
        description: '目标版本（留空 = 跑该轴的全部版本）'
        required: false
        default: ''

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compat:
    name: ${{ matrix.dep }}@${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      # 一格失败不取消其余格 —— 兼容矩阵要的是**完整**的「哪里会坏」图
      fail-fast: false
      matrix:
        # Vue 当前 minor（3.5，`packages/*/package.json` 的 `^3.5.43`）与**下一个** minor。
        #
        # 为什么不是「前一 minor」：`@vean/ui@0.50.2` 的 peer 是 `vue: ">=3.5.0"`，产物里用了
        # 3.5 才有的 `useTemplateRef`/`useId`/`onWatcherCleanup`，钉到 3.4.38 会让
        # `packages/devtools` 的客户端构建报 `[MISSING_EXPORT]` 失败，连累 L2。
        # 而 3.4.38 与 3.5.43 之间**没有可用的 Vue 发布**（3.5.x 起点是 3.5.0），
        # 「跑得通的上一 minor」并不存在。3.6 预发布则是 `@vitejs/plugin-vue` 的 peer
        # （`^3.2.25 || ^3.6.0-rc.10`）明确留出的格子。详见 `scripts/dep-matrix.mjs` 的 AXES。
        # 加 Vite 大版本轴时在这里加 `include:`，并在 AXES 登记。
        dep: [vue]
        version: ['3.5.43', '3.6.0-rc.11']
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run L2 against ${{ matrix.dep }}@${{ matrix.version }}
        # 脚本内部会改 overrides → install → 跑 L2 → 逐字节还原两份入库文件并重装，
        # 所以这里不需要（也不应该）单独跑一遍 restore step。
        run: node scripts/dep-matrix.mjs --dep ${{ matrix.dep }} --version ${{ matrix.version }}
