name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: npx githublogen
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test` 会跑 `pnpm -r test`，其中 `packages/cli/test/dev-dx.test.ts` 直接
      # `chromium.launch()`。Playwright 的浏览器不在 node_modules 里、也不在缓存里，
      # 缺了它就是 `Executable doesn't exist at /home/runner/.cache/ms-playwright/...`
      # （2026-10-07 v0.6.1-beta.1 的发布就是这么挂的，而它发生在 publish 之前 一步 ——
      #  好在门禁把住了，否则是「带着红灯发出去」）。cache key 与 ci.yml 同口径
      # （不钉 PLAYWRIGHT_BROWSERS_PATH，让本地与 CI 共用默认位置）。
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: PNPM build
        run: pnpm run build

      # TS-06:发布前必须过质量门禁。此前 release.yml 只有 install + build + publish,
      # 全仓 typecheck/lint/test 一次都没跑过(grep -cE "pnpm (test|typecheck|lint)" = 0),
      # 于是「本地全绿才发版」纯属假设。三道门禁都在 publish 之前,任一红灯即中止发布。
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Publish to NPM
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
          NPM_CONFIG_PROVENANCE: true
