name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: npx githublogen
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test` 会跑 `pnpm -r test`，其中 `packages/cli/test/dev-dx.test.ts` 直接
      # `chromium.launch()`。Playwright 的浏览器不在 node_modules 里、也不在缓存里，
      # 缺了它就是 `Executable doesn't exist at /home/runner/.cache/ms-playwright/...`
      # （2026-10-07 v0.6.1-beta.1 的发布就是这么挂的，而它发生在 publish 之前 一步 ——
      #  好在门禁把住了，否则是「带着红灯发出去」）。cache key 与 ci.yml 同口径
      # （不钉 PLAYWRIGHT_BROWSERS_PATH，让本地与 CI 共用默认位置）。
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: PNPM build
        run: pnpm run build

      # TS-06:发布前必须过质量门禁。此前 release.yml 只有 install + build + publish,
      # 全仓 typecheck/lint/test 一次都没跑过(grep -cE "pnpm (test|typecheck|lint)" = 0),
      # 于是「本地全绿才发版」纯属假设。三道门禁都在 publish 之前,任一红灯即中止发布。
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # 预发布**绝不能**占 `latest`。npm publish 默认给每个版本打 `latest`，而 `latest`
      # 正是 `pnpm add ubean` 装到的版本。2026-10-09 发布 v0.6.1-beta.2 时就这么把全部
      # 24 个包的 `latest` 从 0.6.0 挪到了 beta 上（该次发布本身的 Publish 步是成功的，
      # 所以没有任何红灯提示），事后用 `npm dist-tag add <pkg>@0.6.0 latest` 才回滚。
      # semver 规定版本号带 `-` 即预发布，据此选 dist-tag；只有正式版才动 `latest`。
      - name: Resolve npm dist-tag
        id: dist-tag
        run: |
          version="$(node -p "require('./packages/ubean/package.json').version")"
          if [[ "$version" == *-* ]]; then
            tag=beta
          else
            tag=latest
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing $version under dist-tag '$tag'"

      - name: Publish to NPM
        run: pnpm -r publish --access public --no-git-checks --tag "${{ steps.dist-tag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
          NPM_CONFIG_PROVENANCE: true
