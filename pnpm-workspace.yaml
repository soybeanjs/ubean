packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples/*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
overrides:
  vite: 'catalog:'
  kysely: '0.28.5'
  markdown-exit: '1.1.0-beta.2'
  typescript: '6.0.3'
shamefullyHoist: true
ignoreWorkspaceRootCheck: true
allowBuilds:
  esbuild: true
  sharp: false
  workerd: true
  koffi: true
  electron: true
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.51'
  - ai@7.0.64
  - '@unhead/bundler@3.3.2'
  - '@unhead/vue@3.3.2'
  - pinia@4.0.3
  - unhead@3.3.2
