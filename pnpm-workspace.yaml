packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples/*'
catalog:
  # 精确钉住（不用 `latest`）：ADR-0012 依赖 vite-plus-core 的 @experimental Builder API，
  # 升级必须是一次显式提交 —— 改这里 → packages/builder/test/vite-plus-contract.test.ts
  # 的精确比对立即生效 → 跑 RM-V23 验收矩阵。当前值 = 2026-09-27 的 npm `latest`。
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  typescript: npm:typescript-native-bridge@latest
  vue-i18n: 11.4.13
  '@intlify/core': 11.4.13
  '@intlify/unplugin-vue-i18n': 11.2.5
overrides:
  vite: 'catalog:'
  typescript: 'catalog:'
shamefullyHoist: true
ignoreWorkspaceRootCheck: true
allowBuilds:
  electron: false
  esbuild: false
  # vue-demi's postinstall only swaps Vue 2/3 entry points; this workspace is Vue 3 only
  # (it arrives transitively via @vean/ui → @tanstack/vue-store)
  vue-demi: false
minimumReleaseAge: 0
