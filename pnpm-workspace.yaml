packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples/*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
overrides:
  vite: 'catalog:'
  kysely: '0.28.5'
  markdown-exit: '1.1.0-beta.2'
  typescript: '6.0.3'
shamefullyHoist: true
ignoreWorkspaceRootCheck: true
allowBuilds:
  esbuild: true
  sharp: false
  workerd: true
  koffi: true
  electron: true
minimumReleaseAgeExclude:
  - '@codemirror/commands@6.11.0'
  - '@codemirror/view@6.43.9'
  - '@ai-sdk/gateway@4.0.56'
  - '@ai-sdk/openai-compatible@3.0.32'
  - '@ai-sdk/provider-utils@5.0.28'
  - '@devframes/hub-ui@0.9.4'
  - '@devframes/hub@0.9.4'
  - '@devframes/json-render-ui@0.9.4'
  - '@devframes/json-render@0.9.4'
  - '@devframes/plugin-inspect@0.9.4'
  - '@devframes/plugin-messages@0.9.4'
  - '@devframes/plugin-terminals@0.9.4'
  - '@devframes/service-open@0.9.4'
  - '@devframes/vite@0.9.4'
  - '@soybeanjs/headless@0.30.0'
  - '@soybeanjs/theme@0.30.0'
  - '@soybeanjs/ui@0.30.0'
  - '@vitejs/devtools-kit@0.5.1'
  - '@vitejs/devtools@0.5.1'
  - ai@7.0.70
  - devframe@0.9.4
  - happy-dom@20.11.6
