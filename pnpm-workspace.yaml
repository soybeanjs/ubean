packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples/*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  vue-i18n: 11.4.8
  '@intlify/core': 11.4.8
  '@intlify/unplugin-vue-i18n': 11.2.5
overrides:
  vite: 'catalog:'
  kysely: '0.28.5'
  markdown-exit: '1.1.0-beta.2'
  typescript: '6.0.3'
shamefullyHoist: true
ignoreWorkspaceRootCheck: true
allowBuilds:
  esbuild: true
  sharp: false
  workerd: true
  koffi: true
  electron: true
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.62'
  - '@ai-sdk/openai-compatible@3.0.35'
  - '@ai-sdk/provider-utils@5.0.29'
  - '@devframes/hub-ui@0.9.5'
  - '@devframes/hub@0.9.5'
  - '@devframes/json-render-ui@0.9.5'
  - '@devframes/json-render@0.9.5'
  - '@devframes/plugin-inspect@0.9.5'
  - '@devframes/plugin-messages@0.9.5'
  - '@devframes/plugin-terminals@0.9.5'
  - '@devframes/service-open@0.9.5'
  - '@devframes/vite@0.9.5'
  - '@unhead/bundler@3.4.0'
  - '@unhead/vue@3.4.0'
  - '@vitejs/devtools-kit@0.5.2'
  - '@vitejs/devtools@0.5.2'
  - ai@7.0.77
  - devframe@0.9.5
  - unhead@3.4.0
